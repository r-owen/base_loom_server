# This workflow will upload a Python Package to PyPI when a new tag is pushed
# From: https://github.com/orgs/community/discussions/178865#discussioncomment-14877939

name: Publish to PyPI on new tag
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install build
        run: pip install build
      - name: Install package dependencies
        run: pip install -e .
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
